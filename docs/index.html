<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesos Jurídicos — Documentación API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
    <style>
        body { margin: 0; background: #fafafa; }
        .topbar { display: none !important; }
        #header-custom {
            background: #2c3e50;
            color: #fff;
            padding: 14px 24px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #header-custom img { height: 24px; }
        #header-custom h1 { font-size: 16px; margin: 0; font-weight: 600; }
        #header-custom span { font-size: 12px; opacity: .7; margin-left: auto; }
    </style>
</head>
<body>
    <div id="header-custom">
        <h1>⚖️ Procesos Jurídicos — API REST</h1>
        <span>OpenAPI 3.0.3</span>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "openapi.yaml",
                dom_id: "#swagger-ui",
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout",
                deepLinking: true,
                docExpansion: "list",
                defaultModelsExpandDepth: -1,
                persistAuthorization: true
            });
        };
    </script>
</body>
</html>
