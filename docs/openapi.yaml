  # ══════════════════════════════════════════════════════════════
  # PLANTILLAS
  # ══════════════════════════════════════════════════════════════
  /backend/controllers/PlantillaController.php:
    get:
      tags: [Plantillas]
      summary: Listar plantillas, variables disponibles o descargar una plantilla
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [list, variables, descargar] }
        - name: todas
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: "Solo `list`: 1 incluye plantillas inactivas"
        - name: id
          in: query
          schema: { type: integer }
          description: "Solo `descargar`: id de la plantilla (devuelve el .docx original)"
      responses:
        "200":
          description: >
            `list` → arreglo de plantillas; `variables` → catálogo de variables
            `{{grupo.campo}}` con su etiqueta; `descargar` → archivo .docx.
          content: { application/json: { schema: { type: array, items: { type: object } } } }
    post:
      tags: [Plantillas]
      summary: Generar un documento o administrar plantillas
      description: >
        `generar` completa las variables `{{grupo.campo}}` de la plantilla con
        los datos del proceso, su cliente, la firma y el abogado con sesión, y
        devuelve el .docx. Los datos que no existan quedan como `__________`
        y se informan en el header `X-Plantilla-Faltantes` (JSON codificado);
        las variables que no existen en el catálogo, en `X-Plantilla-Desconocidas`.
        Con `guardar=1` también guarda una copia en los Anexos del proceso
        (categoría "Documentos generados"; header `X-Plantilla-Guardado: 1`).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [generar, subir, reemplazar, actualizar, eliminar] }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                plantilla_id: { type: integer, description: "generar" }
                proceso_id:   { type: integer, description: "generar" }
                guardar:      { type: integer, enum: [0, 1], description: "generar: guarda copia en Anexos" }
                id:           { type: integer, description: "reemplazar / actualizar / eliminar" }
                nombre:       { type: string, description: "subir / actualizar" }
                categoria:    { type: string, description: "subir / actualizar" }
                descripcion:  { type: string, description: "subir / actualizar" }
                activo:       { type: integer, enum: [0, 1], description: "actualizar" }
                archivo:      { type: string, format: binary, description: "subir / reemplazar: .docx, máx. 5 MB" }
      responses:
        "200":
          description: >
            `generar` → archivo .docx (application/vnd.openxmlformats-officedocument.wordprocessingml.document);
            las demás acciones → `{success, message?, id?}`.
          content: { application/json: { schema: { type: object } } }

  /backend/controllers/Configuracioncontroller.php:
    get:
      tags: [Parametrización]
      summary: Consultar la configuración general del sistema
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [get] }
      responses:
        "200":
          description: "Mapa clave-valor: nombre_empresa, subtitulo, nit, telefono, email, direccion, ciudad, website, pie_reporte, anio_copyright, credenciales de SAMAI."
          content: { application/json: { schema: { type: object } } }
    post:
      tags: [Parametrización]
      summary: Guardar configuración, o probar la conexión con SAMAI
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [save, test_samai] }
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: "Solo action=save — cualquier subconjunto de estos campos"
              properties:
                nombre_empresa: { type: string }
                subtitulo: { type: string }
                nit: { type: string }
                telefono: { type: string }
                email: { type: string }
                direccion: { type: string }
                ciudad: { type: string }
                website: { type: string }
                pie_reporte: { type: string }
                anio_copyright: { type: string }
                samai_session_id: { type: string }
                samai_xsrf_token: { type: string }
                samai_tipmix: { type: string }
      responses:
        "200":
          description: "`save` → `{success}`. `test_samai` → `{success, message}` con el resultado de la prueba de conexión."
          content: { application/json: { schema: { type: object } } }

  # ══════════════════════════════════════════════════════════════
  # REPORTES
  # ══════════════════════════════════════════════════════════════
  /backend/reportes/reporte_proceso.php:
    get:
      tags: [Reportes]
      summary: Generar el reporte imprimible (HTML/PDF) de un proceso
      description: >
        Se abre en pestaña nueva con `window.open()`, por eso el token de
        autenticación va en la URL (`?token=`) y no en el header
        `Authorization`.
      security:
        - tokenQuery: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Token JWT (el mismo que se usa como Bearer en el resto de la API)
        - name: honorarios
          in: query
          schema: { type: string, enum: ["0", "1"], default: "1" }
          description: Si se incluye la sección de honorarios en el reporte
      responses:
        "200":
          description: Página HTML (lista para imprimir/exportar a PDF desde el navegador) con los datos del proceso, actuaciones y honorarios.
          content:
            text/html: { schema: { type: string } }
        "401":
          description: Token ausente o inválido
          content:
            text/plain: { schema: { type: string, example: "Acceso no autorizado" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en AuthController.php?action=login
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: Mismo JWT, pasado por query string (solo reporte_proceso.php)